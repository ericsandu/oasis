name: CIB Engine Hermetic CI

on:
  push:
    branches:
      - main
      - feat/cib-modular-engine
  pull_request:
    branches:
      - main
      - feat/cib-modular-engine

jobs:
  test:
    name: Hermetic Unit, Pattern & AST Guardrails Test Suite
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pip install --upgrade pip
          pip install poetry==1.8.3
          poetry config installer.max-workers 4

      - name: Install dependencies via Poetry
        run: |
          poetry install --no-interaction

      - name: Run Static AST Guardrails (No sqlite3 in bot behaviors)
        run: |
          poetry run pytest cib_zoo/tests/test_ast_guardrails.py -v

      - name: Run Full CIB Test Suite
        run: |
          poetry run pytest cib_zoo/tests/ -v
